spring:
  application:
    name: proexpense-backend
  datasource:
    url: jdbc:postgresql://localhost:5434/proexpense
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: 8090